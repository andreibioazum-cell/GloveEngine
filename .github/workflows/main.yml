name: GloveEngine

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 21

    - name: Install Clang 17 and libc++
      # same toolchain the project's own CI uses (build/common/versions: GITHUB_CLANG_VERSION=17);
      # Filament host builds require Clang with -stdlib=libc++ (see CMakeLists.txt)
      run: |
        sudo apt-get update -y
        sudo apt-get install -y clang-17 libc++-17-dev libc++abi-17-dev mesa-common-dev libxi-dev libxxf86vm-dev

    - uses: android-actions/setup-android@v3

    - name: Install Android SDK packages
      run: |
        yes | sdkmanager --licenses
        # versions are pinned in android/build.gradle / build/common/versions
        # the compileSdk platform (android-37) is auto-downloaded by AGP
        # once the licenses above are accepted (same as the project's own CI)
        sdkmanager --install "build-tools;36.0.0" "platform-tools" "ndk;29.0.14206865"

    - name: Build
      env:
        CC: clang-17
        CXX: clang++-17
      run: |
        set -euo pipefail
        # builds: host tools (matc, resgen, ...) -> engine libs for the requested
        # ABIs -> AARs -> sample APK.
        # -q arm64-v8a,armeabi-v7a = the 64-bit + 32-bit ARM pair; use "-q all" to
        # build all four ABIs (arm64-v8a, armeabi-v7a, x86_64, x86).
        ./build.sh -k sample-gltf-viewer -q arm64-v8a,armeabi-v7a -i debug

    - name: Package
      run: |
        set -euo pipefail
        cp out/sample-gltf-viewer-debug.apk GloveEngine.apk

    - uses: actions/upload-artifact@v4
      with:
        name: GloveEngine
        path: |
          GloveEngine.apk
          out/filament-android-debug.aar
          out/gltfio-android-debug.aar
          out/filament-utils-android-debug.aar
          out/filamat-android-debug.aar
