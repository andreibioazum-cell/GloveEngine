name: GloveEngine

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 21

    - uses: android-actions/setup-android@v3

    - name: Install Android SDK packages
      run: |
        yes | sdkmanager --licenses
        # versions are pinned in android/build.gradle / build/common/versions
        sdkmanager --install "platforms;android-37" "build-tools;36.0.0" "platform-tools" "ndk;29.0.14206865"

    - name: Build
      run: |
        set -euo pipefail
        # builds: host tools (matc, resgen, ...) -> engine libs for the requested
        # ABIs -> AARs -> sample APK.
        # -q arm64-v8a,armeabi-v7a = the 64-bit + 32-bit ARM pair; use "-q all" to
        # build all four ABIs (arm64-v8a, armeabi-v7a, x86_64, x86).
        ./build.sh -k sample-gltf-viewer -q arm64-v8a,armeabi-v7a -i debug

    - name: Package
      run: |
        set -euo pipefail
        cp out/sample-gltf-viewer-debug.apk GloveEngine.apk

    - uses: actions/upload-artifact@v4
      with:
        name: GloveEngine
        path: |
          GloveEngine.apk
          out/filament-android-debug.aar
          out/gltfio-android-debug.aar
          out/filament-utils-android-debug.aar
          out/filamat-android-debug.aar
